apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crossplane-system

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: crossplane-state-metrics
      app.kubernetes.io/component: exporter

resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - podmonitor.yaml

images:
  - name: ghcr.io/nikogura/crossplane-state-metrics
    newTag: latest
