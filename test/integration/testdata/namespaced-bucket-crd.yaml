# A Crossplane v2 namespaced managed resource. The *.m.* infix is what
# distinguishes the namespaced variant of an upbound provider's group, and the
# scope is Namespaced rather than Cluster. Objects of this kind must carry their
# own namespace in the xp_namespace label - not the exporter pod's namespace,
# which is what a bare "namespace" label would resolve to at scrape time.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.s3.aws.m.upbound.io
spec:
  group: s3.aws.m.upbound.io
  names:
    kind: Bucket
    listKind: BucketList
    plural: buckets
    singular: bucket
    categories:
      - crossplane
      - managed
      - aws
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [forProvider]
              properties:
                forProvider:
                  type: object
                  properties:
                    region: {type: string}
            status:
              type: object
              properties:
                atProvider:
                  type: object
                  properties:
                    region: {type: string}
                    arn: {type: string}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, reason, status, type]
                    properties:
                      lastTransitionTime: {type: string, format: date-time}
                      message: {type: string}
                      reason: {type: string}
                      status: {type: string}
                      type: {type: string}
