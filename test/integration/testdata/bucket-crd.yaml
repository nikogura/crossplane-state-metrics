# An upjet-shaped managed resource: status.atProvider echoes the declared
# spec.forProvider fields back, so this kind is drift-comparable. Paired in the
# integration tests with the real provider-talos Configuration CRD, whose
# provider reports only computed results and therefore is not.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: buckets.s3.aws.upbound.io
spec:
  group: s3.aws.upbound.io
  names:
    kind: Bucket
    listKind: BucketList
    plural: buckets
    singular: bucket
    categories:
      - crossplane
      - managed
      - aws
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [forProvider]
              properties:
                forProvider:
                  type: object
                  properties:
                    region:
                      type: string
                    objectLock:
                      type: boolean
                    tags:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                atProvider:
                  type: object
                  properties:
                    region:
                      type: string
                    objectLock:
                      type: boolean
                    tags:
                      type: object
                      additionalProperties:
                        type: string
                    arn:
                      type: string
                    id:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, reason, status, type]
                    properties:
                      lastTransitionTime: {type: string, format: date-time}
                      message: {type: string}
                      reason: {type: string}
                      status: {type: string}
                      type: {type: string}
