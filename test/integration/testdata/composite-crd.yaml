# A composite resource CRD as crossplane-runtime generates it from an XRD.
#
# Two things make this the case the exporter must not miss: the API group is
# whatever the XRD author chose, so it matches no upbound or crossplane.io glob,
# and the only category is "composite" - crossplane-runtime appends that and
# does NOT add "crossplane". The composite category is therefore the sole signal
# that finds the layer a platform team actually works in.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xeksclusters.platform.example.dev
spec:
  group: platform.example.dev
  names:
    kind: XEksCluster
    listKind: XEksClusterList
    plural: xeksclusters
    singular: xekscluster
    categories:
      - composite
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    region: {type: string}
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, reason, status, type]
                    properties:
                      lastTransitionTime: {type: string, format: date-time}
                      message: {type: string}
                      reason: {type: string}
                      status: {type: string}
                      type: {type: string}
