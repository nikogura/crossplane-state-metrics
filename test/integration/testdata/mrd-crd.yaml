# The Crossplane v2 ManagedResourceDefinition. Its spec.state field toggles
# whether the underlying CRD is created at all, and it defaults to Inactive —
# so an unactivated definition means the managed resource kind does not exist
# in the cluster and emits no other metric.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: managedresourcedefinitions.apiextensions.crossplane.io
spec:
  group: apiextensions.crossplane.io
  names:
    kind: ManagedResourceDefinition
    listKind: ManagedResourceDefinitionList
    plural: managedresourcedefinitions
    singular: managedresourcedefinition
    categories:
      - crossplane
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [group, names]
              properties:
                group: {type: string}
                names:
                  type: object
                  required: [kind, plural]
                  properties:
                    kind: {type: string}
                    plural: {type: string}
                state:
                  type: string
                  default: Inactive
                  enum: [Active, Inactive]
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, reason, status, type]
                    properties:
                      lastTransitionTime: {type: string, format: date-time}
                      message: {type: string}
                      reason: {type: string}
                      status: {type: string}
                      type: {type: string}
